<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2A3E6C" />
  <title>MixYard · Specialty Concrete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy:'#2A3E6C', kelly:'#02AA13', mint:'#60CBB1', slateish:'#5B6B86', paper:'#F4F6F9' },
          fontFamily: { display:['\"Bebas Neue\"','sans-serif'], sans:['\"Open Sans\"','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { margin:0; background:#F4F6F9; color:#2A3E6C; font-family:'Open Sans',system-ui,sans-serif; }
    .font-display { font-family:'Bebas Neue',sans-serif; letter-spacing:.04em; }
    input, select, textarea, button { font-family:inherit; }
    .field { width:100%; border:1px solid rgba(42,62,108,.15); border-radius:12px; padding:10px 12px; background:#fff; font-size:14px; }
    .field:focus { outline:none; border-color:#02AA13; box-shadow:0 0 0 3px rgba(2,170,19,.15); }
    .btn { min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:0 16px; font-weight:600; font-size:14px; }
    .btn-p { background:#02AA13; color:#fff; }
    .btn-g { background:#fff; color:#2A3E6C; border:1px solid rgba(42,62,108,.15); }
    .btn-n { background:#2A3E6C; color:#fff; }
    .btn-d { background:#e11d48; color:#fff; }
    .card { background:#fff; border:1px solid rgba(42,62,108,.1); border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .badge { display:inline-flex; align-items:center; white-space:nowrap; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  </style>
</head>
<body class="font-sans">
<div id="app"></div>
<script src="./app.1.js"></script>
<script src="./app.2.js"></script>
<script src="./app.3.js"></script>
</body>
</html>
